name: Renovate

on:
  workflow_dispatch:
  schedule:
    # Hourly, which is what self-hosted Renovate recommends.
    # Quoted because `*` is special in YAML.
    - cron: '15 * * * *'

concurrency:
  group: renovate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  renovate:
    name: Renovate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Renovate
        uses: renovatebot/github-action@v46.3.14
        with:
          configurationFile: .github/renovate-config.json
          # public_repo can open dependency PRs. Updating workflow files
          # also needs the `workflow` scope on this token.
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          # The classic token can see every public repo it has access to.
          # Keep runs limited to this repository.
          RENOVATE_REPOSITORIES: ${{ github.repository }}
